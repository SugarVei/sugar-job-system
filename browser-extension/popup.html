<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{font:14px system-ui;width:300px;padding:14px;color:#24211d}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #d8d0c2}button{background:#24211d;color:white;border:0;font-weight:600;cursor:pointer;transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}button:hover:not(:disabled){background:#3a352f;transform:translateY(-1px);box-shadow:0 5px 12px rgba(36,33,29,.2)}button:active:not(:disabled){transform:translateY(0);box-shadow:0 2px 5px rgba(36,33,29,.18)}button:disabled{cursor:not-allowed;opacity:.6}.muted{color:#766f65;font-size:12px;line-height:1.5}#result{min-height:20px}</style></head><body><h3>Sugar 智能填表助手</h3><div id="status" class="muted">正在检查连接…</div><input id="code" inputmode="numeric" maxlength="6" placeholder="输入系统生成的 6 位配对码"><button id="pair">连接插件</button><button id="sync">同步标准资料</button><button id="fill">填写当前页面</button><div id="result" class="muted"></div><script src="popup.js"></script></body></html>
