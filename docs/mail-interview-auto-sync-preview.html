<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>邮箱面试自动同步 · 交互设计预览</title>
<style>
:root{--ink:#1b1a17;--muted:#8a8478;--paper:#fffdf8;--line:#e0d8c9;--accent:#9a5b62;--soft:#f5e4e1;--green:#2f7a45;--amber:#98691c}
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:var(--ink);font:14px/1.65 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9a5b6299;outline-offset:3px}button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:7px 13px;white-space:nowrap}.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}.accent{color:var(--accent);border-color:var(--accent);background:var(--soft)}.quiet{background:transparent;border:0;color:var(--muted)}button:hover:not(:disabled){filter:brightness(.97)}.demo{border-bottom:1px solid var(--line);background:#eeebe3;padding:11px 28px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}.demo strong{font-weight:700}.demo-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.demo select{max-width:210px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:5px 8px}.demo button{padding:5px 9px;font-size:12px}main{max-width:1440px;margin:auto;padding:26px 32px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}h1{font-size:28px;letter-spacing:-1px;margin:0;line-height:1.3}.sub{color:var(--muted);font-size:12px;margin:7px 0 0}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{border:0;background:transparent;border-radius:0;padding:10px 16px;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom:2px solid var(--accent)}.account,.sync{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px 18px}.account{margin-bottom:10px}.identity{display:flex;gap:12px;align-items:center;min-width:0}.mail-icon{flex:none;width:44px;height:44px;background:var(--soft);border-radius:13px;display:grid;place-items:center;color:var(--accent)}.mail-icon svg{width:22px;height:22px}.account-title{font-size:16px;font-weight:700}.connected{font-size:12px;color:var(--green);margin-left:12px}.dot{display:inline-block;width:7px;height:7px;margin-right:5px;background:currentColor;border-radius:50%}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sync{background:#faf7f0;border-radius:14px;padding:12px 18px}.sync-title{font-size:13px;font-weight:700}.sync-meta{font-size:12px;color:var(--muted);margin-top:3px}.switch{width:36px;height:21px;border-radius:15px;border:0;padding:3px;background:#aea89c;display:flex;align-items:center;flex:none}.switch[aria-checked=true]{background:var(--green)}.switch:after{content:'';width:15px;height:15px;border-radius:50%;background:#fff;transform:translateX(0)}.switch[aria-checked=true]:after{transform:translateX(15px)}.warn{color:var(--amber)}.bad{color:#a43a32}.good{color:var(--green)}.mail-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;margin-top:18px;min-height:460px}.mail-list,.detail{border:1px solid var(--line);border-radius:18px;background:var(--paper);min-width:0;overflow:hidden}.list-heading{padding:15px 18px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list-heading small{font-size:11px;font-weight:400;color:var(--muted)}.mail-row{display:block;width:100%;border:0;border-bottom:1px solid #ebe5d8;border-radius:0;padding:17px 18px;text-align:left;background:transparent;white-space:normal}.mail-row.active{background:#fff8e9}.mail-row strong{display:block;font-size:13px;font-weight:700}.mail-row small{display:block;font-size:11px;color:var(--muted);margin:5px 0}.mail-row p{font-size:12px;margin:5px 0;color:#6b6458}.badge{font-size:10px;border-radius:20px;padding:2px 7px;display:inline-block;font-weight:700;background:#e7eee2;color:#477051}.badge.pending{background:#fbeec2;color:#7a5a12}.badge.cancelled{background:#eee9e2;color:#797165}.detail{padding:26px 30px}.detail-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detail h2{font-size:20px;line-height:1.5;letter-spacing:-.4px;margin:0 0 7px}.sender{font-size:12px;color:var(--muted)}.mail-body{white-space:pre-line;margin:24px 0;color:#554f44;font-size:14px;line-height:2}.result{border-top:1px solid var(--line);padding-top:17px;margin-top:24px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.result strong{font-size:13px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.fields small{display:block;color:var(--muted);font-size:11px}.fields span{font-size:13px}.calendar{margin-top:18px;background:white;border:1px solid #eef0f3;border-radius:24px;padding:18px}.week-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 15px}.week-heading strong{font-size:17px}.week-heading small{color:var(--muted)}.week{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));font-size:11px}.day{padding:8px 2px;text-align:center;color:#6e747c;border-bottom:1px solid #eef0f3}.day strong{display:block;font-size:15px;font-weight:600;color:#30313a}.hour,.cell{min-height:34px;border-bottom:1px solid #f1f2f5}.hour{color:#8b9099;padding-top:7px}.cell{border-left:1px solid #f1f2f5;padding:2px;min-width:0}.event{display:block;border:0;border-left:3px solid var(--accent);border-radius:5px;background:var(--soft);padding:3px 6px;white-space:normal;width:100%;text-align:left;font-size:10px;line-height:1.45;color:#73424a;margin:1px 0 3px}.event strong{display:block;font-size:10px}.event.manual{background:#e7efea;color:#3f6650;border-left-color:#6c927c}.mobile-events{display:none}.mobile-event{display:flex;gap:15px;border-bottom:1px solid #eee;padding:15px 2px;text-align:left;width:100%;border-radius:0;white-space:normal}.history{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.empty{padding:35px 16px;color:var(--muted);text-align:center}.footnote{font-size:11px;color:var(--muted);margin-top:13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 18px;border-radius:11px;box-shadow:0 6px 30px #0002;max-width:calc(100% - 32px);font-size:13px;z-index:5}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:20px;padding:0;color:var(--ink);background:var(--paper);width:min(640px,calc(100% - 28px));max-height:90vh;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#1b1a1744}.modal-top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}.modal-top h2{font-size:18px;margin:0}.modal-body{padding:22px 24px}.suggestion{border-bottom:1px solid var(--line);padding:0 0 22px;margin:0 0 22px}.suggestion:last-child{margin:0;border:0;padding:0}.suggestion h3{font-size:14px;margin:0 0 8px}.evidence{font-size:12px;background:#f2eee5;padding:12px;border-radius:9px;white-space:pre-line}.difference{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}.difference div{border:1px solid var(--line);padding:12px;border-radius:9px}.difference small{display:block;font-size:11px;color:var(--muted)}.suggestion label{font-size:12px;display:block;margin:12px 0}.suggestion input{display:block;width:100%;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px;margin-top:5px}.modal-body .actions{justify-content:flex-end;margin-top:16px}[hidden]{display:none!important}
@media(max-width:760px){.demo{padding:12px 16px}.demo-controls{width:100%}main{padding:22px 16px}h1{font-size:24px}.page-head{margin-bottom:16px}.account,.sync{align-items:flex-start;flex-wrap:wrap;padding:13px}.account .actions,.sync>.actions{width:100%}.account-title{font-size:14px}.connected{display:block;margin:2px 0}.mail-layout{grid-template-columns:1fr;min-height:0}.mail-list{max-height:248px;overflow:auto}.detail{padding:22px 18px}.detail h2{font-size:17px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.week{display:none}.mobile-events{display:block}.calendar{padding:16px;border-radius:18px}.week-heading{align-items:flex-start;flex-direction:column;gap:4px}.difference{grid-template-columns:1fr}.modal-body,.modal-top{padding:18px}.demo select{max-width:190px}.history{flex-wrap:wrap}.result-head{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="demo"><div><strong>交互设计预览</strong> · 示例数据 · 演示主内容区域，保留现有全局导航</div><div class="demo-controls"><label for="scenario">收信情境</label><select id="scenario"><option value="new">明确的新面试</option><option value="duplicate">重复通知</option><option value="reschedule">明确改期</option><option value="cancel">取消安排</option><option value="ambiguous">时间尚未明确</option><option value="conflict">与手动改期冲突</option><option value="aiError">AI API 失效</option><option value="mailError">邮箱授权失效</option></select><button id="simulate" class="primary">演示收信</button><button id="reset">重置</button></div></div>
<main>
<div class="page-head"><div><h1 id="page-title">面试邮件</h1><p class="sub" id="page-sub">连接你的邮箱，让确定的面试安排自动出现在日历里。</p></div><button id="calendar-shortcut" class="accent">查看面试日历 →</button></div>
<nav class="tabs" role="tablist" aria-label="设计预览视图"><button role="tab" id="mail-tab" aria-selected="true" aria-controls="mail-panel">邮箱视图</button><button role="tab" id="calendar-tab" aria-selected="false" aria-controls="calendar-panel">日历视图</button></nav>
<section class="account"><div class="identity"><div class="mail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div><div><span class="account-title">QQ 邮箱 · demo</span><span id="connection" class="connected"><i class="dot"></i>已连接</span><p class="sub">demo@example.com · 示例邮箱</p></div></div><div class="actions"><button id="settings">管理邮箱与 AI</button></div></section>
<section class="sync" aria-label="自动同步状态"><div><div class="identity"><button id="toggle" class="switch" role="switch" aria-label="自动加入面试日历" aria-checked="true"></button><span id="sync-title" class="sync-title">自动加入面试日历 · 已开启</span></div><div id="sync-meta" class="sync-meta">使用 DeepSeek · 每 5 分钟检查收件箱 · 上次成功检查 14:05</div></div><div class="actions"><button id="review-button" class="warn">待确认 1</button><button id="check">立即检查</button><button id="repair" class="primary" hidden>修复连接</button></div></section>
<section id="mail-panel" role="tabpanel" aria-labelledby="mail-tab"><div class="mail-layout"><div class="mail-list"><div class="list-heading">邮件列表 <small>按收信时间排序</small></div><div id="mails"></div></div><article id="detail" class="detail" aria-label="邮件详情"></article></div></section>
<section id="calendar-panel" role="tabpanel" aria-labelledby="calendar-tab" hidden><div class="calendar"><div class="week-heading"><strong>2026 年 10 月 12 日 — 18 日</strong><small id="calendar-count"></small></div><div id="week" class="week"></div><div id="mobile-events" class="mobile-events"></div><div class="history"><span class="sub">同一时段的面试分别展示，手动记录继续保留。</span><button id="history-button" class="quiet">查看变更记录</button></div></div></section>
<p class="footnote">此设计稿可离线打开。操作只改变示例数据；实际后台同步、邮箱读取和 AI 提取尚未开发。</p>
</main>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button id="close-modal" class="quiet" aria-label="关闭">✕</button></div><div id="modal-body" class="modal-body"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,toastTimer;
function reset(){state={enabled:true,busy:false,error:null,view:'mail',selected:'confirmed',last:'14:05',counter:0,events:[{id:'e1',company:'星河科技',role:'产品经理',round:'一面',time:'2026-10-16T09:34',source:'auto',status:'scheduled',mail:'confirmed'},{id:'e2',company:'远山制造',role:'IE工程师',round:'二面',time:'2026-10-16T09:45',source:'manual',status:'scheduled'}],mails:[{id:'confirmed',company:'星河科技',subject:'面试安排确认｜产品经理一面',body:'你好，\n\n星河科技产品经理岗位一面安排已确定。\n面试时间：2026年10月16日 09:34（北京时间）\n面试形式：线上视频\n会议链接将另行发送。\n\n期待与你交流。',status:'added',received:'14:03',event:'e1'},{id:'uncertain',company:'青禾设计',subject:'面试沟通｜设计师岗位',body:'你好，\n\n我们希望就青禾设计的设计师岗位安排一次面试，预计下周进行。\n具体日期和时间尚未确定，稍后与你确认。',status:'pending',received:'13:48'}],suggestions:[{id:'s0',mail:'uncertain',company:'青禾设计',role:'设计师',reason:'缺少明确日期和时间',type:'time'}],changes:['14:05 · 星河科技面试已自动加入日历']};$('scenario').value='new';$('modal').close();render()}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function openModal(title,html){$('modal-title').textContent=title;$('modal-body').innerHTML=html;if(!$('modal').open)$('modal').showModal()}
function tab(view){state.view=view;render()}
const statusLabel={added:'已加入日历',pending:'待确认',duplicate:'重复通知',updated:'已更新日历',cancelled:'已取消安排',ignored:'已忽略'};
function render(){
 const pending=state.suggestions.length,error=state.error;
 $('page-title').textContent=state.view==='mail'?'面试邮件':'面试日历';$('page-sub').textContent=state.view==='mail'?'连接你的邮箱，让确定的面试安排自动出现在日历里。':'每一场面试都有来源，每一次变更都可以追溯。';
 $('calendar-shortcut').textContent=state.view==='mail'?'查看面试日历 →':'查看面试邮件 →';
 $('mail-panel').hidden=state.view!=='mail';$('calendar-panel').hidden=state.view!=='calendar';$('mail-tab').setAttribute('aria-selected',String(state.view==='mail'));$('calendar-tab').setAttribute('aria-selected',String(state.view==='calendar'));
 $('toggle').setAttribute('aria-checked',String(state.enabled));
 $('sync-title').textContent=state.busy?'正在检查新邮件…':error?(error==='ai'?'AI 暂不可用 · 待处理邮件已保留':'邮箱连接失效 · 自动同步已暂停'):state.enabled?'自动加入面试日历 · 已开启':'自动加入面试日历 · 已暂停';
 $('sync-title').className='sync-title'+(error?' bad':'');$('sync-meta').textContent=error==='ai'?'请检查现有 AI API 的有效性和额度，修复后继续处理。':error==='mail'?'请更新邮箱授权码，修复后补充处理暂停期间的新邮件。':`使用 DeepSeek · 每 5 分钟检查收件箱 · 上次成功检查 ${state.last}${state.enabled?'':' · 已录入安排保留'}`;
 $('connection').innerHTML=error==='mail'?'连接需修复':'<i class="dot"></i>已连接';$('connection').className='connected'+(error==='mail'?' bad':'');$('repair').hidden=!error;$('check').disabled=state.busy||!state.enabled||Boolean(error);$('check').textContent=state.busy?'检查中…':'立即检查';$('simulate').disabled=state.busy;$('review-button').textContent=`待确认 ${pending}`;
 $('mails').innerHTML=state.mails.map(m=>`<button class="mail-row${m.id===state.selected?' active':''}" data-mail="${esc(m.id)}" aria-pressed="${m.id===state.selected}"><strong>${esc(m.company)}</strong><small>招聘团队 · 今天 ${esc(m.received)}</small><p>${esc(m.subject)}</p><span class="badge${m.status==='pending'?' pending':m.status==='cancelled'?' cancelled':''}">${statusLabel[m.status]}</span></button>`).join('');
 document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.mail;render()});renderDetail();renderCalendar();
}
function renderDetail(){const m=state.mails.find(m=>m.id===state.selected);if(!m){$('detail').innerHTML='<div class="empty">请选择一封邮件。</div>';return}const ev=state.events.find(e=>e.id===m.event);const text=ev?`${ev.time.slice(5,10).replace('-','月')}日 ${ev.time.slice(11)} · 北京时间`:null;
 $('detail').innerHTML=`<div class="detail-top"><div><h2>${esc(m.subject)}</h2><div class="sender">${esc(m.company)}招聘团队 &lt;hr@example.com&gt;<br>发送给我 · 2026年10月14日 ${esc(m.received)}（示例）</div></div><span class="badge${m.status==='pending'?' pending':m.status==='cancelled'?' cancelled':''}">${statusLabel[m.status]}</span></div><div class="mail-body">${esc(m.body)}</div><div class="result"><div class="result-head"><strong>${m.status==='pending'?'需要确认后才能更新日历':m.status==='ignored'?'已保留你的处理选择':m.status==='cancelled'?'取消记录已保留':'面试安排已保存'}</strong>${m.status==='pending'?'<button id="detail-action" class="accent">确认安排</button>':ev?'<button id="detail-action" class="accent">查看日历安排 →</button>':''}</div>${ev?`<div class="fields"><div><small>公司与岗位</small><span>${esc(ev.company)} · ${esc(ev.role)}</span></div><div><small>当前时间</small><span>${esc(text)}</span></div><div><small>状态</small><span>${ev.status==='cancelled'?'已取消':ev.source==='manual'?'手动安排':'来自邮箱 · 自动同步'}</span></div></div>`:'<p class="sub">原邮件尚未给出确定时间。填写后可加入日历，也可以等待后续确认邮件。</p>'}<p class="sub">${m.status==='duplicate'?'已关联同一场面试，日历没有重复创建。':m.status==='cancelled'?'有效日历已移除此场面试，历史与来源继续保留。':m.status==='pending'?'自动同步会继续处理其他明确的安排。':'可从日历详情返回这封来源邮件。'}</p></div>`;
 const action=$('detail-action');if(action)action.onclick=()=>m.status==='pending'?showSuggestions():tab('calendar');
}
function renderCalendar(){const events=state.events.filter(e=>e.status==='scheduled');$('calendar-count').textContent=`${events.length} 场安排 · ${events.filter(e=>e.source==='auto').length} 场来自邮箱`;
 let html='<div class="day"></div>'+['周一','周二','周三','周四','周五','周六','周日'].map((d,i)=>`<div class="day">${d}<strong>${12+i}</strong></div>`).join('');for(let h=8;h<=20;h++){html+=`<div class="hour">${String(h).padStart(2,'0')}:00</div>`;for(let d=12;d<=18;d++){const cell=events.filter(e=>Number(e.time.slice(8,10))===d&&Number(e.time.slice(11,13))===h);html+=`<div class="cell">${cell.map(e=>`<button class="event${e.source==='manual'?' manual':''}" data-event="${e.id}">${e.time.slice(11)} · ${e.source==='auto'?'来自邮箱':'手动'}<strong>${esc(e.company)} · ${esc(e.round)}</strong></button>`).join('')}</div>`}}$('week').innerHTML=html;
 $('mobile-events').innerHTML=events.length?events.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(e=>`<button class="mobile-event" data-event="${e.id}"><span>${e.time.slice(5,10)}<br><strong>${e.time.slice(11)}</strong></span><span><strong>${esc(e.company)}</strong><br>${esc(e.role)} · ${esc(e.round)}<br><small>${e.source==='auto'?'来自邮箱':'手动安排'}</small></span></button>`).join(''):'<div class="empty">本周没有有效面试安排。</div>';
 document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>showEvent(b.dataset.event));
}
function showEvent(id){const e=state.events.find(e=>e.id===id);openModal('面试详情',`<h3>${esc(e.company)} · ${esc(e.round)}</h3><p>${esc(e.role)}<br>${esc(e.time.replace('T',' '))} · 北京时间</p><p class="sub">${e.source==='auto'?'来自邮箱 · 自动保存，手动修改会受到保护':'手动安排 · 保留现有编辑与拖动操作'}</p><div class="actions">${e.mail?'<button id="source" class="accent">查看来源邮件</button>':''}<button id="event-history">查看变更记录</button></div>`);if($('source'))$('source').onclick=()=>{state.selected=e.mail;$('modal').close();tab('mail')};$('event-history').onclick=showHistory}
function showHistory(){openModal('同步与变更记录',state.changes.slice().reverse().map(c=>`<p>${esc(c)}</p>`).join('')+'<p class="sub">取消和用户处理的记录继续保留，不重复创建面试。</p>')}
function showSuggestions(){openModal('待确认的安排',state.suggestions.length?state.suggestions.map(s=>`<section class="suggestion"><h3>${esc(s.company)} · ${esc(s.reason)}</h3><div class="evidence">${esc(state.mails.find(m=>m.id===s.mail)?.body)}</div>${s.type==='conflict'?`<div class="difference"><div><small>你手动保存的时间</small><strong>${esc(s.current.replace('T',' '))}</strong></div><div><small>邮件建议时间</small><strong>${esc(s.proposed.replace('T',' '))}</strong></div></div><p class="sub">后台没有覆盖你的修改，请选择采用哪一个时间。</p><div class="actions"><button data-keep="${s.id}">保留手动时间</button><button data-accept="${s.id}" class="primary">采用邮件时间</button></div>`:`<form data-form="${s.id}"><label>请确认面试日期和时间<input name="when" type="datetime-local" required aria-label="${esc(s.company)}的面试时间"></label><div class="actions"><button type="button" data-keep="${s.id}">忽略此建议</button><button type="submit" class="primary">确认并加入日历</button></div></form>`}</section>`).join(''):'<div class="empty">全部安排都已处理，没有待确认邮件。</div>');
 document.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>resolve(b.dataset.keep,false));document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>resolve(b.dataset.accept,true));document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();resolve(f.dataset.form,true,f.elements.when.value)});
}
function resolve(id,accept,time){const s=state.suggestions.find(x=>x.id===id),m=state.mails.find(x=>x.id===s.mail);if(accept){if(s.type==='conflict'){state.events.find(e=>e.id==='e1').time=s.proposed;m.event='e1';m.status='updated'}else{const eid='user'+(++state.counter);state.events.push({id:eid,company:s.company,role:s.role,round:'面试',time,source:'auto',status:'scheduled',mail:m.id});m.event=eid;m.status='added'}state.changes.push(`14:06 · 用户确认了${s.company}的邮件安排`)}else{m.status='ignored';state.changes.push(`14:06 · ${s.company}：${s.type==='conflict'?'保留用户手动时间':'用户忽略此建议'}`)}state.suggestions=state.suggestions.filter(x=>x.id!==id);render();showSuggestions();notify(accept?'确认已保存，日历已更新':'已保留你的选择')}
function simulate(){if(state.busy)return;if(!state.enabled){notify('自动同步已暂停，恢复后继续检查');return}if(state.error){notify('请先修复连接，待处理邮件已保留');return}state.busy=true;render();setTimeout(()=>{state.busy=false;if(!state.enabled){render();notify('已暂停，本次检查没有写入新安排');return}const scene=$('scenario').value,origin=state.events.find(e=>e.id==='e1');if(scene==='aiError'||scene==='mailError'){state.error=scene==='aiError'?'ai':'mail';render();notify('同步已暂停，待处理邮件已保留');return}const id='m'+(++state.counter);let m={id,company:'星河科技',received:'14:06',event:'e1',status:'added'};
 if(scene==='new'){m={...m,company:'澄明咨询',subject:'面试时间确认｜业务分析师',body:'你好，\n\n澄明咨询业务分析师岗位面试已确定。\n时间：2026年10月16日 10:30（北京时间）\n形式：电话面试。',event:'e3'};if(!state.events.find(e=>e.id==='e3')){state.events.push({id:'e3',company:m.company,role:'业务分析师',round:'一面',time:'2026-10-16T10:30',source:'auto',status:'scheduled',mail:id});state.changes.push('14:06 · 澄明咨询面试已自动加入日历')}else m.status='duplicate'}
 if(scene==='duplicate'){m.subject='再次提醒｜产品经理面试';m.body='再次提醒：星河科技产品经理一面已确定。\n原通知的日程标识不变，请按最新确认时间参加。';m.status='duplicate'}
 if(scene==='reschedule'){m.subject='面试改期确认｜产品经理一面';m.body='你好，\n\n此前的星河科技产品经理一面现改期为：\n2026年10月16日 15:34（北京时间）。\n请以本次通知为准。';m.status='updated';origin.time='2026-10-16T15:34';origin.status='scheduled';origin.mail=id;state.changes.push('14:06 · 星河科技由 09:34 改为 15:34')}
 if(scene==='cancel'){m.subject='面试取消通知｜产品经理一面';m.body='你好，\n\n因招聘安排调整，取消此前通知中的星河科技产品经理一面。\n后续如有新安排，我们会另行联系。';m.status='cancelled';origin.status='cancelled';origin.mail=id;state.changes.push('14:06 · 星河科技面试已取消，历史保留')}
 if(scene==='ambiguous'){m={...m,company:'晨光软件',subject:'面试安排沟通｜开发工程师',body:'你好，\n\n晨光软件开发工程师岗位预计下周面试。\n具体日期和时间稍后确认。',status:'pending',event:null};state.suggestions.push({id:'s'+state.counter,mail:id,company:m.company,role:'开发工程师',reason:'日期和时间尚未明确',type:'time'})}
 if(scene==='conflict'){origin.time='2026-10-16T11:34';origin.status='scheduled';m.subject='面试改期确认｜与手动时间冲突';m.body='星河科技产品经理一面改期为：\n2026年10月16日 15:34（北京时间）。\n请以本次通知为准。';m.status='pending';state.suggestions.push({id:'s'+state.counter,mail:id,company:m.company,reason:'与你手动修改的时间不同',type:'conflict',current:origin.time,proposed:'2026-10-16T15:34'});state.changes.push('14:06 · 用户手动将星河科技改为 11:34；邮件改期等待确认')}
 state.mails.unshift(m);state.selected=id;state.last='14:06';render();notify(scene==='duplicate'?'已关联现有安排，没有重复添加':m.status==='pending'?'这封邮件需要确认，其余安排继续自动同步':m.status==='cancelled'?'面试已取消，历史继续保留':'面试日历已自动更新');},450)}
function settings(){openModal('邮箱与 AI 设置',`<p>示例邮箱：demo@example.com</p><p>选用已有 AI：DeepSeek</p><p>自动检查范围：收件箱 · 每 5 分钟<br>默认时区：北京时间</p><p class="sub">实际功能将复用现有邮箱和 AI 设置入口。此预览不读取或保存真实 API Key、邮箱密码。</p>${state.error?'<div class="actions"><button id="recover" class="primary">恢复连接（演示）</button></div>':''}`);if($('recover'))$('recover').onclick=()=>{state.error=null;state.enabled=true;$('modal').close();render();notify('连接已恢复，继续处理待办邮件')}}
 $('toggle').onclick=()=>{state.enabled=!state.enabled;render();notify(state.enabled?'自动同步已恢复':'自动同步已暂停，已录入安排保留')};$('review-button').onclick=showSuggestions;$('settings').onclick=settings;$('repair').onclick=settings;$('close-modal').onclick=()=>$('modal').close();$('mail-tab').onclick=()=>tab('mail');$('calendar-tab').onclick=()=>tab('calendar');$('calendar-shortcut').onclick=()=>tab(state.view==='mail'?'calendar':'mail');$('history-button').onclick=showHistory;$('simulate').onclick=simulate;$('check').onclick=simulate;$('reset').onclick=()=>{clearTimeout(toastTimer);$('toast').hidden=true;reset()};
 reset();
</script>
</body>
